---
# SPDX-FileCopyrightText: 2026 Joel Winarske
# SPDX-License-Identifier: Apache-2.0

# The Firebase C++ SDK built the way a board builds it: through emb's augment,
# from example/.emb/base.emb.yaml.
#
# ci.yml builds the same SDK with scripts/build_firebase_sdk.sh. Two paths to
# one SDK is what this exists to keep honest -- they drifted once and it cost a
# release-shaped bug: the augment set FIREBASE_LINUX_USE_CXX11_ABI and the
# script did not, so every std::string-taking Firestore and Auth symbol in
# CI's library was left unresolved while local builds against the augment
# linked cleanly. Nothing compared the two, so nothing said so.
#
# Native (`--target local`), not a board cross-build: the augment definitions,
# patches and defines are the same object either way, and it is those that
# drift. Cross-building aarch64 here would add a toolchain, a sysroot image and
# ivi-homescreen's checkout to test the same manifest -- pios.yml in
# ivi-homescreen already does that, and does it properly.
name: emb

on:
  pull_request:
    paths:
      - ".github/workflows/emb.yml"
      - "example/.emb/**"
      - "packages/firebase_ffi/native/**"
      - "packages/firebase_ffi/hook/**"
      - "packages/firebase_ffi/patches/**"
      - "scripts/build_firebase_sdk.sh"
      # The flatpak is the workbench app, so a change to it is one to build.
      - "example/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/emb.yml"
      - "example/.emb/**"
      - "packages/firebase_ffi/native/**"
      - "packages/firebase_ffi/hook/**"
      - "packages/firebase_ffi/patches/**"
      - "scripts/build_firebase_sdk.sh"
      # The flatpak is the workbench app, so a change to it is one to build.
      - "example/**"
  # Weekly, because the path filters above mean a quiet stretch runs nothing:
  # this job broke on 8 Sep and nothing noticed until a PR touched native/ on
  # 1 Oct. The pin below stops emb drifting; the runner image, the SDK's own
  # downloads and its pip requirements still can.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EMB_REPO: https://github.com/toyota-connected/emb_cli.git
  # Pinned. emb is cloned, not installed from a release, and an unpinned
  # clone took a behavior change the day after it merged: --prepare began
  # building the embedder, which an app manifest on its own does not have
  # (fixed in emb_cli#289). Move it deliberately, and to a commit both
  # configurations below have been built with.
  EMB_REF: 4db9f79cc1db20821225b3ecf30de1be13dbc9bd  # main, 0.8.0-dev with emb_cli#383-#385
  EMB_WS: ${{ github.workspace }}/.emb-ws

jobs:
  augment:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        firestore: ["OFF", "ON"]
    name: emb augment (Firestore ${{ matrix.firestore }})
    steps:
      - uses: actions/checkout@v7
        with:
          path: firebase_ffi

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build libsecret-1-dev uuid-dev python3-venv \
            protobuf-compiler golang-go

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # A commit, so not `clone --branch`: fetch the one object and check it
      # out.
      - name: Fetch emb
        run: |
          git init -q emb_cli
          git -C emb_cli fetch -q --depth 1 "$EMB_REPO" "$EMB_REF"
          git -C emb_cli checkout -q FETCH_HEAD
          git -C emb_cli log -1 --format='emb_cli %H %cs'

      # The SDK's CMake looks for an interpreter that can import its own
      # requirements, and finds one on PATH. ci.yml points
      # FIREBASE_PYTHON_EXECUTABLE at a venv, but that route is closed here:
      # emb's -D reaches the embedder configure only, and augment builds keep
      # their own defines, so nothing on the command line can set it. Leading
      # PATH with the venv is what an augment can be given.
      #
      # The requirement list is the SDK's own, fetched at the pinned tag rather
      # than duplicated here, so it cannot drift from what the build imports.
      - name: Python for the SDK build
        run: |
          python3 -m venv "$HOME/fb-venv"
          curl -fsSL --retry 5 --retry-all-errors \
            -o /tmp/pip_requirements.txt \
            https://raw.githubusercontent.com/firebase/firebase-cpp-sdk/v14.2.0/external/pip_requirements.txt
          "$HOME/fb-venv/bin/pip" install -q -r /tmp/pip_requirements.txt
          echo "$HOME/fb-venv/bin" >> "$GITHUB_PATH"

      # The augment source archive. emb keeps it beside the extracted tree and
      # skips the download when it is present, so this turns the fetch into a
      # no-op rather than saving extraction work. It is under the project that
      # declared the augment, not under the workspace.
      - name: Cache augment sources
        uses: actions/cache@v6
        with:
          path: firebase_ffi/example/.cache/overlay-src/*.tar.gz
          key: emb-src-${{ hashFiles('firebase_ffi/example/.emb/base.emb.yaml') }}

      # The built overlay: the ~40 minute artifact, and the reason this job is
      # affordable to run per PR. emb does not content-key the overlay prefix
      # (it is overlay-<triple>, so the two Firestore configurations would
      # overwrite each other in one workspace), so the key is ours to compose:
      # the augment definitions and every patch that feeds them, plus the
      # configuration, since OFF and ON are different builds under one path.
      - name: Cache built overlay
        id: overlay
        uses: actions/cache@v6
        with:
          path: ${{ env.EMB_WS }}/.config/flutter_workspace/overlay-x86_64-linux-gnu
          # The salt is how a cached overlay is invalidated when emb changes
          # what it does with an unchanged manifest. The key hashes the augment
          # definitions and the patches -- our inputs -- but not the tool that
          # consumes them, and emb ignoring the `when:` gate was exactly that
          # kind of change: the manifest was right, the output was wrong, and
          # the key could not tell. The first entries this job saved contained
          # Firestore in both configurations, and a re-run after emb was fixed
          # restored one of them and skipped the build.
          #
          # Bump v5 when emb's behavior changes in a way the manifest hash
          # cannot see. Keying on emb's own commit would do it automatically
          # and cost a 20 minute rebuild on every emb commit, which is the
          # wrong trade for a dependency that is usually irrelevant here.
          #
          # v5: emb_cli#339. A local target never saw an augment it had built,
          # so every run rebuilt the SDK over the restored overlay. emb now
          # leaves a stamp in the overlay and skips on it. A v4 overlay has
          # none, and a restored key is never saved again, so v4 would rebuild
          # on every run and drop the stamp each time.
          key: >-
            emb-overlay-v5-${{ matrix.firestore }}-14.2.0-${{
              hashFiles('firebase_ffi/example/.emb/base.emb.yaml',
                        'firebase_ffi/packages/firebase_ffi/patches/firebase-cpp-sdk/common/*.patch',
                        'firebase_ffi/packages/firebase_ffi/patches/firebase-cpp-sdk/linux/*.patch') }}

      # -D reaches the augment `when:` gates: a CLI define is baked into the
      # target (CrossTarget.withDefineOverrides), and the gates read the
      # target's defines. It does not override the augment's own defines --
      # those pick the products, and the gate picks which augment.
      - name: Build the SDK augment
        working-directory: firebase_ffi/example
        run: |
          eval "$(../../emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb -v cross . --target local --prepare \
            -D FIREBASE_WITH_FIRESTORE=${{ matrix.firestore }} \
            -w "$EMB_WS"

      - name: Show what the augment installed
        run: |
          PREFIX="$EMB_WS/.config/flutter_workspace/overlay-x86_64-linux-gnu/usr"
          echo "prefix: $PREFIX"
          find "$PREFIX" -name 'libfirebase_*.a' -printf '%f\n' | sort
          # The flag whose absence in the script path cost a day. The archives
          # are the artifact, so the archives are what gets asserted: a legacy
          # ABI build mangles this symbol without the __cxx11 tag.
          if nm -C "$PREFIX"/lib/firebase-cpp-sdk/app/libfirebase_app.a 2>/dev/null \
               | grep -q '__cxx11'; then
            echo "C++11 ABI: present"
          else
            echo "::error::augment built the SDK with the legacy libstdc++ ABI"
            exit 1
          fi

          # The configuration this cell asked for is the one it must have got.
          # Without this, both cells built the same SDK for a while and the run
          # was green throughout: the ABI assertion above passed either way,
          # and nothing looked at the product set. emb's --prepare ignored the
          # augment's `when:` gate, so the ON variant -- last in the manifest --
          # won the shared overlay prefix in both cells.
          if [ -f "$PREFIX/lib/firebase-cpp-sdk/firestore/libfirebase_firestore.a" ]; then
            built=ON
          else
            built=OFF
          fi
          echo "Firestore in the SDK: $built (asked for ${{ matrix.firestore }})"
          if [ "$built" != "${{ matrix.firestore }}" ]; then
            echo "::error::asked the augment for Firestore=${{ matrix.firestore }} and got $built"
            exit 1
          fi

      - name: Build and test against the augment
        working-directory: firebase_ffi/packages/firebase_ffi
        run: |
          PREFIX="$EMB_WS/.config/flutter_workspace/overlay-x86_64-linux-gnu/usr"
          dart pub get --no-example
          # Every product the augment builds, so one it leaves out fails to
          # link here. Only Firestore was on, and App Check was missing from
          # the augment without this job noticing.
          cmake -S native -B build-emb -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DFDB_WITH_FIRESTORE=${{ matrix.firestore }} \
            -DFDB_WITH_STORAGE=ON \
            -DFDB_WITH_FUNCTIONS=ON \
            -DFDB_WITH_REMOTE_CONFIG=ON \
            -DFDB_WITH_APP_CHECK=ON \
            -DFDB_BUILD_TESTS=ON
          cmake --build build-emb --parallel
          ctest --test-dir build-emb --output-on-failure -V

      # --no-undefined is on the library, so a link that resolves is already
      # the assertion. This reports what it resolved against.
      - name: Confirm the library resolves
        working-directory: firebase_ffi/packages/firebase_ffi
        run: |
          ldd -r build-emb/libfirebase_ffi.so 2>&1 | grep -i undefined && {
            echo "::error::unresolved symbols in the emb-built library"; exit 1; }
          echo "no unresolved symbols"
          ls -l build-emb/libfirebase_ffi.so

  # The demo app as a flatpak, built by emb and checked inside the runtime it
  # ships against.
  #
  # Against the runtime's own SDK: ivi-homescreen's flatpak-sdk-x86_64 target,
  # with this app's layered on in example/.emb/flatpak.emb.yaml. emb compiles
  # with the host clang against org.freedesktop.Sdk, so the bundle links the
  # runtime's glibc whatever the host is. It used to be `--target local`,
  # which linked the host's and only ran on a host older than the runtime.
  flatpak:
    runs-on: ubuntu-24.04
    name: emb flatpak
    env:
      # The embedder. Pinned for the same reason emb is.
      IVI_REF: f00d5c189ac70b6272f7364138896b70be425521
    steps:
      - uses: actions/checkout@v7
        with:
          path: firebase_ffi

      - uses: actions/checkout@v7
        with:
          repository: toyota-connected/ivi-homescreen
          ref: ${{ env.IVI_REF }}
          path: ivi-homescreen
          submodules: recursive

      # clang, lld and llvm are the flatpak-sdk provider's compiler, linker and
      # binutils; the SDK supplies the libraries. gcc 14 and pugixml build the
      # embedder's wayland-cxx-scanner, a host tool. elfutils is
      # flatpak-builder's eu-strip, which it runs on the host.
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build g++-14 clang lld llvm libpugixml-dev \
            flatpak flatpak-builder elfutils
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14
          gcc --version | head -1

      # flatpak-builder and flatpak run both sandbox with bwrap, which needs
      # unprivileged user namespaces. The runner's AppArmor turns them off.
      - name: Flatpak runtime
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Fetch emb
        run: |
          git init -q emb_cli
          git -C emb_cli fetch -q --depth 1 "$EMB_REPO" "$EMB_REF"
          git -C emb_cli checkout -q FETCH_HEAD

      # The SDK's Python requirements, as in the augment job. Only a cache
      # miss below builds the SDK.
      - name: Python for the SDK build
        run: |
          python3 -m venv "$HOME/fb-venv"
          curl -fsSL --retry 5 --retry-all-errors \
            -o /tmp/pip_requirements.txt \
            https://raw.githubusercontent.com/firebase/firebase-cpp-sdk/v14.2.0/external/pip_requirements.txt
          "$HOME/fb-venv/bin/pip" install -q -r /tmp/pip_requirements.txt
          echo "$HOME/fb-venv/bin" >> "$GITHUB_PATH"

      # The SDK augment, Firestore ON, built against the flatpak SDK into its
      # own overlay beside it.
      - name: Cache built overlay
        uses: actions/cache@v6
        with:
          path: ${{ env.EMB_WS }}/.config/flutter_workspace/overlay-x86_64-flatpak-linux-gnu
          key: >-
            emb-flatpak-sdk-overlay-v1-ON-14.2.0-${{
              hashFiles('firebase_ffi/example/.emb/base.emb.yaml',
                        'firebase_ffi/packages/firebase_ffi/patches/firebase-cpp-sdk/common/*.patch',
                        'firebase_ffi/packages/firebase_ffi/patches/firebase-cpp-sdk/linux/*.patch') }}

      # The committed pubspec builds without Firebase so the example resolves
      # with no SDK installed. Turn it on. emb's cmake wrapper gives the hook
      # the overlay, so the hook finds the SDK with no path.
      - name: Build the example with Firebase
        working-directory: firebase_ffi/example
        run: |
          sed -i '/^\s*with_firebase: false$/d' pubspec.yaml
          ! grep -q with_firebase pubspec.yaml

      - name: Build the flatpak
        working-directory: firebase_ffi/example
        run: |
          eval "$(../../emb_cli/bootstrap.sh --shellenv)"
          emb flutter --flutter-version "$(cat ../../ivi-homescreen/.flutter-version)" \
            -w "$EMB_WS"
          emb -v cross ../../ivi-homescreen --target flatpak-sdk-x86_64 \
            --backend wayland-egl --app . --build --flatpak \
            -D FIREBASE_WITH_FIRESTORE=ON \
            -w "$EMB_WS"
          bundle=$(find "$EMB_WS/.config/flutter_workspace" -path '*/dist/*.flatpak')
          if [ -z "$bundle" ] || [ "$(grep -c . <<<"$bundle")" != 1 ]; then
            echo "::error::expected one flatpak bundle, found: ${bundle:-none}"
            exit 1
          fi
          ls -l "$bundle"
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"

      # What the app is given and whether it can load, both from inside the
      # runtime. ldd in the sandbox resolves against the runtime alone, so a
      # host library or a too-new symbol version shows up as not found. Here
      # strings, not `echo | grep -q`: under pipefail grep exiting early can
      # SIGPIPE the echo and fail a check that passed.
      - name: Check the flatpak
        run: |
          app=io.github.jwinarske.FirebaseFfiDemo
          flatpak install --user -y --noninteractive "$BUNDLE"
          perms=$(flatpak info --show-permissions "$app")
          echo "$perms"
          if grep -qiE 'filesystems=|org\.freedesktop\.secrets' <<<"$perms"; then
            echo "::error::the sandbox has filesystem or Secret Service access"
            exit 1
          fi
          out=$(flatpak run --command=sh "$app" -c \
            "ldd /app/$app/homescreen /app/$app/lib/*.so*" 2>&1) || true
          echo "$out"
          # ldd's exit status is ignored, so a sandbox that never started has to
          # be caught here: nothing resolved means nothing was checked.
          if ! grep -q '=> /usr/lib/' <<<"$out"; then
            echo "::error::ldd did not run in the sandbox"
            exit 1
          fi
          if grep -q 'not found' <<<"$out"; then
            echo "::error::the app needs something the runtime does not have"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: firebase-ffi-demo-flatpak
          path: ${{ env.BUNDLE }}
          retention-days: 14
