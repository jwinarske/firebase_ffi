# What the matrix proves, and what it deliberately does not.
#
# Every platform builds *without* the Firebase C++ SDK. That is not a reduced
# test — it is exactly the portable surface. `dart test` runs the build hook, so
# each job exercises the CMake project, the C ABI, the code-asset declaration,
# and the hook's own platform logic (library naming, PATH lookup, C++ driver
# derivation, multi-config generators) before running the Dart tests against
# the library it just produced.
#
# Linking the SDK is Linux-only and refused at configure time elsewhere, so
# building it on macOS or Windows would only re-assert the guard. It is also a
# ~40 minute source build with patches, which does not belong on every push.
#
# Dart alone, no Flutter: `dart pub get --no-example` keeps example/ — a Flutter
# app — out of resolution, which is the only reason a Flutter SDK was ever
# needed here. That is also what lets the arm64 job run, since Flutter ships no
# arm64 Linux archive while Dart does.

name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
  schedule:
    # Weekly, to catch a runner image moving under us rather than a change here.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Format + analyze ──────────────────────────────────────────────────
  format:
    name: Format check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      # Scoped to this package: example/ is a Flutter app, and with
      # --no-example its packages are unresolved, so analyzing it here would
      # report every Flutter symbol as undefined. It gets its own job below.
      - run: dart format --output=none --set-exit-if-changed lib test hook tool bin
      - run: dart analyze --fatal-infos lib test hook tool bin
      # Two paths build one SDK: the script globs the patch directories, the
      # emb manifest names each patch by hand, and only the first picks up a
      # new one. They drifted -- 0007 went into common/ and the manifest kept
      # listing 0001 through 0005 -- and nothing said so, because that patch
      # only fails a cold macOS build while emb builds Linux.
      - name: Assert the emb manifest applies the same patches
        working-directory: .
        run: scripts/check_emb_patches.sh

  # ── Ubuntu x86_64 ─────────────────────────────────────────────────────
  build-ubuntu-x64:
    name: Ubuntu 24.04 / x86_64
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - name: Build hook + Dart tests
        run: dart test --reporter=expanded
      - name: Library the hook produced
        run: ls -l $(find .dart_tool -name 'libfirebase_ffi.so' | head -1)

  # ── Ubuntu arm64 ──────────────────────────────────────────────────────
  # The Raspberry Pi target architecture, built natively rather than crossed.
  build-ubuntu-arm64:
    name: Ubuntu 24.04 / arm64
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - run: dart test
      - name: Library the hook produced
        run: ls -l $(find .dart_tool -name 'libfirebase_ffi.so' | head -1)

  # ── macOS ─────────────────────────────────────────────────────────────
  # First proof the hook's .dylib naming and PATH lookup are right; both were
  # written without a Mac to check them against.
  #
  # Job shape follows meta-flutter/workspace-automation's macos.yaml.
  build-macos:
    name: macOS ${{ matrix.os }}
    if: "!contains(github.event.pull_request.labels.*.name, 'ci: skip macos')"
    env:
      NONINTERACTIVE: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Environment
        run: |
          echo "macOS version: $(sw_vers -productVersion)"
          echo "Architecture:  $(uname -m)"
          echo "CMake:         $(cmake --version | head -1)"

      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - run: dart test --reporter=expanded

      - name: Library the hook produced
        run: |
          found=$(find .dart_tool -name 'libfirebase_ffi.dylib' | head -1)
          if [ -z "$found" ]; then echo "no .dylib produced"; exit 1; fi
          ls -l "$found"
          file "$found"

  # ── Windows ───────────────────────────────────────────────────────────
  # MSVC's generator is multi-config, so this is what checks that the hook
  # builds Release rather than Debug and looks in the right subdirectory.
  #
  # Job shape follows meta-flutter/workspace-automation's windows.yaml.
  build-windows:
    name: Windows ${{ matrix.os }}
    if: "!contains(github.event.pull_request.labels.*.name, 'ci: skip windows')"
    env:
      NONINTERACTIVE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Environment
        shell: bash
        run: |
          echo "Windows version: $(cmd //c ver)"
          echo "Architecture:    $PROCESSOR_ARCHITECTURE"
          echo "CMake:           $(cmake --version | head -1)"

      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - run: dart test --reporter=expanded

      - name: Library the hook produced
        shell: bash
        run: |
          # CMake keeps the lib prefix here, so both spellings are accepted —
          # the hook searches for both too.
          found=$(find .dart_tool \( -name 'firebase_ffi.dll' -o -name 'libfirebase_ffi.dll' \) | head -1)
          if [ -z "$found" ]; then echo "no .dll produced"; exit 1; fi
          ls -l "$found"

  # ── firebase_core_ffi ────────────────────────────────────────────────
  #
  # The firebase_core implementation, and the registration point every other
  # facade package needs. Flutter rather than Dart: implementing the
  # *_platform_interface contracts requires it, which is exactly why these live
  # in separate packages from firebase_ffi.
  facade:
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - firebase_core_ffi
          - firebase_auth_ffi
          - firebase_storage_ffi
          - cloud_firestore_ffi
          - cloud_functions_ffi
          - firebase_remote_config_ffi
          - firebase_app_check_ffi
          - firebase_database_ffi
    defaults:
      run:
        working-directory: packages/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # ── Firebase C++ SDK (Linux) ──────────────────────────────────────────
  # Built once and cached, per platform. The SDK ships no install rules and
  # does not build unmodified on current toolchains, so this applies the same
  # patches the emb augment uses — common/ then linux/. ~40 minutes cold; the
  # key covers those directories and the script, so it rebuilds only when one
  # of them changes.
  #
  # Only Linux for now. macOS and Windows need install rules of their own,
  # which is why the patch set is muxed by platform rather than shared.
  sdk-linux:
    name: Firebase C++ SDK (Linux)
    runs-on: ubuntu-24.04
    outputs:
      prefix: ${{ steps.paths.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        run: echo "prefix=$HOME/firebase-sdk" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/firebase-sdk
          key: fbsdk-ubuntu-24.04-13.12.0-${{ hashFiles('packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/common/*.patch', 'packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/linux/*.patch', 'scripts/build_firebase_sdk.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install build deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libsecret-1-dev uuid-dev protobuf-compiler python3-venv
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build and install the SDK
        env:
          FIREBASE_BUILD_VERBOSE: "1"
        run: scripts/build_firebase_sdk.sh "$HOME/firebase-sdk"
      - name: What was installed
        run: |
          ls "$HOME/firebase-sdk/lib/cmake/firebase_cpp_sdk/"
      # The script selects products; nothing checked the result matched until
      # an SDK built with the wrong set linked fine and announced itself much
      # later. Both directions are asserted: a product missing, and a product
      # present that nothing asked for.
      - name: Assert the product set
        run: |
          scripts/check_sdk_products.sh "$HOME/firebase-sdk" \
            auth database storage firestore functions remote_config app_check
          du -sh "$HOME/firebase-sdk"

  # ── Linux, linking the SDK ────────────────────────────────────────────
  # The jobs above build the portable core without Firebase. This is the one
  # that links it, so the SDK-dependent code is compiled somewhere.
  build-ubuntu-firebase:
    name: Ubuntu 24.04 / x86_64 (with Firebase SDK)
    needs: sdk-linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/firebase-sdk
          key: fbsdk-ubuntu-24.04-13.12.0-${{ hashFiles('packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/common/*.patch', 'packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/linux/*.patch', 'scripts/build_firebase_sdk.sh') }}
          fail-on-cache-miss: true
      - name: Install deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libsecret-1-dev uuid-dev
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - name: Point the hook at the cached SDK
        # User-defines come from the root pubspec, and this package's own sets
        # with_firebase: false so a fresh clone can run its pure-Dart tests
        # without an SDK. Here there is one, so both are overridden in place.
        run: |
          python3 - "$HOME/firebase-sdk" <<'EOF'
          import pathlib, sys
          prefix = sys.argv[1]
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          s = s.replace('      with_firebase: false',
                        f'      firebase_sdk: {prefix}')
          p.write_text(s)
          print(s[s.index('hooks:'):])
          EOF
      - run: dart test --reporter=expanded
      - name: The library must actually contain the SDK
        run: |
          so=$(find .dart_tool -name 'libfirebase_ffi.so' | head -1)
          ls -l "$so"
          symbols=$(nm -D --defined-only "$so" | grep -c ' T fdb_')
          echo "exported fdb_ symbols: $symbols"
          # 9 is the transport-only ABI; the SDK build exports 19.
          if [ "$symbols" -lt 19 ]; then
            echo "::error::built without the Firebase SDK ($symbols symbols)"
            exit 1
          fi

  # ── Linux, binding Firestore ──────────────────────────────────────────
  # The only job that compiles firestore_impl.cpp, and the one that measures
  # what binding Firestore costs: the same commit built both ways, so the
  # difference is a number rather than a claim.
  build-ubuntu-firestore:
    name: Ubuntu 24.04 (with Firestore)
    needs: sdk-linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/firebase-sdk
          key: fbsdk-ubuntu-24.04-13.12.0-${{ hashFiles('packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/common/*.patch', 'packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/linux/*.patch', 'scripts/build_firebase_sdk.sh') }}
          fail-on-cache-miss: true
      - name: Install deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libsecret-1-dev uuid-dev
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - name: Build without Firestore, for the comparison
        run: |
          python3 - "$HOME/firebase-sdk" <<'EOF'
          import pathlib, sys
          p = pathlib.Path('pubspec.yaml')
          p.write_text(p.read_text().replace('      with_firebase: false',
                                             f'      firebase_sdk: {sys.argv[1]}'))
          EOF
          dart test --reporter=failures-only
          so=$(find .dart_tool -name 'libfirebase_ffi.so' | head -1)
          echo "WITHOUT_FIRESTORE=$(stat -c%s "$so")" >> "$GITHUB_ENV"
      - name: Build with Firestore
        run: |
          rm -rf .dart_tool/hooks_runner
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          i = s.index('      firebase_sdk:')
          s = s[:i] + '      products: [auth, database, firestore]\n' + s[i:]
          p.write_text(s)
          EOF
          dart test --reporter=expanded
          so=$(find .dart_tool -name 'libfirebase_ffi.so' | head -1)
          echo "WITH_FIRESTORE=$(stat -c%s "$so")" >> "$GITHUB_ENV"
      # Storage's own cost, measured the same way and separately from
      # Firestore's: the two are independent products and an app that binds
      # one is not told what the other would have cost it.
      - name: Build with Firestore and Storage
        run: |
          rm -rf .dart_tool/hooks_runner
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('pubspec.yaml')
          p.write_text(p.read_text().replace(
              '      products: [auth, database, firestore]',
              '      products: [auth, database, firestore, storage]'))
          EOF
          dart test --reporter=failures-only
          so=$(find .dart_tool -name 'libfirebase_ffi.so' | head -1)
          echo "WITH_STORAGE=$(stat -c%s "$so")" >> "$GITHUB_ENV"
      - name: Native codec tests
        # The C++ half of the codec. The Dart tests cover the Dart half, and
        # neither could catch a bug in the other: a sizing fault in the native
        # encoder shipped and only surfaced against a live backend.
        run: |
          cmake -S native -B build-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/firebase-sdk" \
            -DFDB_WITH_FIRESTORE=ON -DFDB_BUILD_TESTS=ON
          cmake --build build-tests --target fdb_codec_test --parallel
          # -V: a passing test's stdout is otherwise suppressed, and the
          # count it prints is the evidence that the Firestore sections
          # compiled in rather than being #if-elided to a smaller number.
          ctest --test-dir build-tests --output-on-failure -V

      - name: What Firestore costs
        run: |
          echo "without Firestore: $WITHOUT_FIRESTORE bytes"
          echo "with Firestore:    $WITH_FIRESTORE bytes"
          echo "  + Storage:       $WITH_STORAGE bytes"
          echo "storage costs:     $(( WITH_STORAGE - WITH_FIRESTORE )) bytes"
          echo "difference:        $(( WITH_FIRESTORE - WITHOUT_FIRESTORE )) bytes"
          # Binding Firestore pulls in gRPC, protobuf and abseil. If the two
          # builds are the same size, the selection did nothing and the file was
          # never compiled.
          if [ "$WITH_FIRESTORE" -le "$WITHOUT_FIRESTORE" ]; then
            echo "::error::selecting Firestore changed nothing — it was not linked"
            exit 1
          fi

  # ── Against a real backend ────────────────────────────────────────────
  #
  # Everything else here builds and links without ever calling the SDK, and
  # that is where the bugs have been: a use-after-free in a Storage completion
  # callback crashed two runs in three, and a Firestore blob decoded as a plain
  # List<int> -- indistinguishable from an array of small integers. No build
  # could have found either. Only calling them does.
  #
  # The emulator suite is the only way to do that in CI: it needs no
  # credentials and no project. Auth, Database and Firestore are covered
  # because the C++ SDK can be pointed at them -- Auth::UseEmulator, a URL
  # override, and a host setting respectively.
  #
  # Storage cannot be, and not for want of the right URL. Desktop Storage
  # rebuilds every request's host from two compile-time constants:
  #
  #   const char kHttpsScheme[] = "https://";
  #   const char kBucketStartString[] = "firebasestorage.googleapis.com/v0/b/";
  #
  # StoragePath::AsHttpMetadataUrl() concatenates those, and every operation
  # goes through it. The url given to GetInstance(app, url) is parsed for the
  # bucket and object path only -- scheme and host are discarded. So no
  # argument redirects Storage at an emulator; that would need an SDK patch.
  # Storage stays on manual verification against a real bucket.
  emulator:
    name: Emulator tests
    needs: sdk-linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/firebase-sdk
          key: fbsdk-ubuntu-24.04-13.12.0-${{ hashFiles('packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/common/*.patch', 'packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/linux/*.patch', 'scripts/build_firebase_sdk.sh') }}
          fail-on-cache-miss: true
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build libsecret-1-dev uuid-dev
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The Firestore and Database emulators are Java, and firebase-tools
      # refuses a JDK older than 21. Pinned rather than taken from the runner:
      # the runner's default is older than that today, and a local JDK 25 is
      # what hid it -- this passed on a developer machine and failed here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      # The emulator runs the callables in test/emulator/functions, which have
      # their own dependencies.
      - name: Install the emulator callables
        working-directory: packages/firebase_ffi/test/emulator/functions
        run: npm install --no-fund --no-audit
      - name: Point the package at the SDK
        run: |
          python3 - "$HOME/firebase-sdk" <<'EOF'
          import pathlib, sys
          p = pathlib.Path('pubspec.yaml')
          p.write_text(p.read_text().replace(
              '      with_firebase: false',
              '      products: [auth, database, firestore, functions, '
              'storage, remote_config, app_check]\n'
              f'      firebase_sdk: {sys.argv[1]}'))
          EOF
      - run: dart pub get --no-example
      - name: Run the bindings against the emulators
        run: ../../scripts/run_emulator_tests.sh
      # Every impl file is inside one extern "C" block, where an anonymous
      # namespace does not make a helper internal -- it is exported under its
      # plain name and collides with any sibling that picked the same one.
      # firebase_impl.cpp and firestore_impl.cpp both had a g_next_txn. Checked
      # here because the objects exist by now, and checked as "exports only the
      # ABI" rather than "no duplicates": a duplicate is only visible in a
      # build that compiles both files, which is the build that already fails.
      - name: Assert the objects export only the C ABI
        working-directory: .
        run: |
          b=$(find packages/firebase_ffi/.dart_tool/hooks_runner -type d -name cmake | head -1)
          scripts/check_exported_symbols.sh "$b"
      # The facade over the same emulators: an app calling firebase_core and
      # firebase_auth, with no mention of firebase_ffi. This is the claim the
      # whole layer makes, so it is checked rather than assumed.
      - name: Set up Flutter for the facade test
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Point the facade packages at the SDK
        # From the repo root: the job's default is packages/firebase_ffi, and
        # these paths are repo-relative.
        working-directory: .
        run: |
          for pkg in firebase_auth_ffi cloud_firestore_ffi firebase_storage_ffi \
                     cloud_functions_ffi firebase_remote_config_ffi \
                     firebase_app_check_ffi firebase_database_ffi; do
            python3 - "$HOME/firebase-sdk" "packages/$pkg/pubspec.yaml" <<'EOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[2])
          p.write_text(p.read_text().replace(
              '      with_firebase: false',
              '      products: [auth, database, firestore, storage, '
              'functions, remote_config, app_check]\n'
              f'      firebase_sdk: {sys.argv[1]}'))
          EOF
            # The hook caches its build per configuration and does not notice a
            # rewritten pubspec on its own; without this the test links the
            # transport-only library and reports "no Firebase SDK".
            rm -rf "packages/$pkg/.dart_tool/hooks_runner" "packages/$pkg/build"
            (cd "packages/$pkg" && flutter pub get)
          done
      - name: Run the facade against the emulators
        run: ../../scripts/run_facade_emulator_tests.sh

  # ── Firebase C++ SDK (macOS) ──────────────────────────────────────────
  # The install rules are shared with Linux now (common/0004); what differs is
  # the linker — ld64 has no --start-group — and the platform's secure store,
  # which is the Keychain rather than libsecret. Both are decided inside the
  # SDK's generated package config, so a consumer does not hardcode either.
  sdk-macos:
    name: Firebase C++ SDK (macOS)
    runs-on: macos-15
    env:
      NONINTERACTIVE: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/firebase-sdk
          key: fbsdk-macos-15-13.12.0-${{ hashFiles('packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/common/*.patch', 'packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/macos/*.patch', 'scripts/build_firebase_sdk.sh') }}
      # Pinned here and not elsewhere: Homebrew ships CMake 4, which refuses
      # Firestore's vendored `cmake_policy(SET CMP0058 OLD)` outright. The
      # Ubuntu and Windows images carry 3.28 and 3.31, which accept it, so they
      # are left as they are rather than pinned for symmetry's sake. Upstream's
      # own desktop workflow pins ~3.31 for the same reason.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install build deps
        run: |
          command -v ninja >/dev/null || brew install ninja
          # Firestore's build generates from .proto; upstream's own prereqs
          # script installs protoc for the same reason.
          command -v protoc >/dev/null || brew install protobuf
          # BoringSSL's build is driven by Go, which the macOS image does not
          # carry. Linux runners happen to have it, which is why this only
          # surfaced here.
          command -v go >/dev/null || brew install go
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build and install the SDK
        env:
          FIREBASE_BUILD_VERBOSE: "1"
        run: scripts/build_firebase_sdk.sh "$HOME/firebase-sdk"
      - name: What was installed
        run: |
          ls "$HOME/firebase-sdk/lib/cmake/firebase_cpp_sdk/"
      # The script selects products; nothing checked the result matched until
      # an SDK built with the wrong set linked fine and announced itself much
      # later. Both directions are asserted: a product missing, and a product
      # present that nothing asked for.
      - name: Assert the product set
        run: |
          scripts/check_sdk_products.sh "$HOME/firebase-sdk" \
            auth database storage firestore functions remote_config app_check
          du -sh "$HOME/firebase-sdk"
          echo "--- the system libs the config publishes ---"
          grep SYSTEM_LIBS "$HOME/firebase-sdk/lib/cmake/firebase_cpp_sdk/firebase_cpp_sdk-config.cmake" || true

  # ── macOS, linking the SDK ────────────────────────────────────────────
  build-macos-firebase:
    name: macOS 15 (with Firebase SDK)
    needs: sdk-macos
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/firebase-sdk
          key: fbsdk-macos-15-13.12.0-${{ hashFiles('packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/common/*.patch', 'packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/macos/*.patch', 'scripts/build_firebase_sdk.sh') }}
          fail-on-cache-miss: true
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - name: Point the hook at the cached SDK
        run: |
          python3 - "$HOME/firebase-sdk" <<'EOF'
          import pathlib, sys
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text().replace('      with_firebase: false',
                                    f'      firebase_sdk: {sys.argv[1]}')
          p.write_text(s)
          EOF
      - run: dart test --reporter=expanded
      - name: The library must actually contain the SDK
        run: |
          dylib=$(find .dart_tool -name 'libfirebase_ffi.dylib' | head -1)
          ls -l "$dylib"
          # nm -gU: exported, defined. 9 is the transport-only ABI; 19 with SDK.
          symbols=$(nm -gU "$dylib" | grep -c ' T _fdb_' || true)
          echo "exported fdb_ symbols: $symbols"
          if [ "$symbols" -lt 19 ]; then
            echo "::error::built without the Firebase SDK ($symbols symbols)"
            exit 1
          fi

  # ── Firebase C++ SDK (Windows) ────────────────────────────────────────
  # The hardest of the three. Notes taken from the SDK's own desktop.yml:
  # long-path support has to be enabled before checkout, the architecture must
  # be named explicitly because the Visual Studio generator's default varies by
  # machine, and the MSVC runtime choice (/MT here) is a real dimension —
  # linking a consumer built the other way fails with symbols that look missing
  # rather than mismatched.
  #
  # Built without vcpkg, matching the other two platforms: the SDK fetches and
  # builds its own dependencies, and external/vcpkg is a submodule absent from
  # the release tarball anyway.
  sdk-windows:
    name: Firebase C++ SDK (Windows)
    if: "!contains(github.event.pull_request.labels.*.name, 'ci: skip windows')"
    runs-on: windows-2022
    steps:
      - name: Enable long-path support
        shell: pwsh
        run: |
          # Two different consumers of MAX_PATH. core.longpaths governs git;
          # the registry setting is what MSBuild's FileTracker honors, and
          # Firestore's nested superbuilds write .tlog paths past 260
          # characters without it.
          git config --system core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/firebase-sdk
          key: fbsdk-windows-2022-13.12.0-${{ hashFiles('packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/common/*.patch', 'packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/windows/*.patch', 'scripts/build_firebase_sdk.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install build deps
        shell: bash
        run: |
          command -v go >/dev/null || choco install golang -y --no-progress
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build and install the SDK
        shell: bash
        env:
          PYTHON: python
          FIREBASE_BUILD_VERBOSE: "1"
        run: scripts/build_firebase_sdk.sh "$HOME/firebase-sdk"
      - name: What was installed
        shell: bash
        run: |
          ls "$HOME/firebase-sdk/lib/cmake/firebase_cpp_sdk/"
      # See the note in the Linux job: the product set is asserted in both
      # directions, because nothing else here checks it.
      - name: Assert the product set
        shell: bash
        run: |
          scripts/check_sdk_products.sh "$HOME/firebase-sdk" \
            auth database storage firestore functions remote_config app_check
          du -sh "$HOME/firebase-sdk"
          grep SYSTEM_LIBS "$HOME/firebase-sdk/lib/cmake/firebase_cpp_sdk/firebase_cpp_sdk-config.cmake" || true

  # ── Windows, linking the SDK ──────────────────────────────────────────
  build-windows-firebase:
    name: Windows 2022 (with Firebase SDK)
    needs: sdk-windows
    runs-on: windows-2022
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/firebase-sdk
          key: fbsdk-windows-2022-13.12.0-${{ hashFiles('packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/common/*.patch', 'packages/firebase_ffi/example/.emb/patches/firebase-cpp-sdk/windows/*.patch', 'scripts/build_firebase_sdk.sh') }}
          fail-on-cache-miss: true
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - name: Point the hook at the cached SDK
        shell: bash
        run: |
          python - "$HOME/firebase-sdk" <<'EOF'
          import pathlib, sys
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text().replace('      with_firebase: false',
                                    '      firebase_sdk: ' + sys.argv[1])
          p.write_text(s)
          print(s[s.index('hooks:'):])
          EOF
      - run: dart test --reporter=expanded
      - name: The library must actually contain the SDK
        shell: bash
        run: |
          dll=$(find .dart_tool \( -name 'firebase_ffi.dll' -o -name 'libfirebase_ffi.dll' \) | head -1)
          if [ -z "$dll" ]; then echo "no .dll produced"; exit 1; fi
          ls -l "$dll"
          # A transport-only build is ~30 KB; with the SDK linked it is megabytes.
          size=$(stat -c%s "$dll" 2>/dev/null || stat -f%z "$dll")
          echo "dll size: $size"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::built without the Firebase SDK ($size bytes)"
            exit 1
          fi

  # ── Example app ───────────────────────────────────────────────────────
  # The one job that needs Flutter, because the example is a Flutter app. It
  # covers what --no-example excludes from the jobs above.
  example:
    name: Example app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Install deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - run: flutter pub get
        working-directory: packages/firebase_ffi/example
      - run: flutter analyze
        working-directory: packages/firebase_ffi/example
      - run: dart format --output=none --set-exit-if-changed lib
        working-directory: packages/firebase_ffi/example

  # ── Publish readiness ─────────────────────────────────────────────────
  publish-check:
    name: Publish readiness
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/firebase_ffi
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - run: dart pub publish --dry-run
      - name: Refuse to publish a credential
        run: |
          # pub assembles the archive from the working tree, so .gitignore is
          # not what protects it. Check the file list pub itself reports.
          listing=$(dart pub publish --dry-run 2>&1 || true)
          if printf '%s' "$listing" | grep -qiE 'google-services\.json|\.jwt|\.pem|keyring\.pass|sa-.*\.json'; then
            printf '%s\n' "$listing"
            echo "::error::a credential would be included in the published archive"
            exit 1
          fi
          echo "no credentials in the archive"
