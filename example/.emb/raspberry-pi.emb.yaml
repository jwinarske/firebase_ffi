# The trixie boards, plus what the Firebase C++ SDK augment needs to build.
id: firebase-nc-bench
type: app
supported_archs: [arm64]
supported_host_types: [fedora, ubuntu]

cross:
  targets:
    rpi5-trixie: &pi_trixie
      sysroot:
        snapshot: 2026-04-22
        dev_packages:
          # The SDK's Linux secure storage links libsecret and its installation
          # id links libuuid; both are needed to build it, not just to run it.
          - libsecret-1-dev
          - uuid-dev
    rpi4-trixie: *pi_trixie
    rpi-zero-2w-trixie: *pi_trixie
