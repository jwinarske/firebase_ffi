# The siblings in this repository rather than published versions. The packages
# this app depends on now name their own dependencies by version, and pub will
# not mix a hosted constraint with a path dependency on the same package —
# these say which one wins here.
dependency_overrides:
  firebase_ffi:
    path: ../packages/firebase_ffi
  firebase_core_ffi:
    path: ../packages/firebase_core_ffi
