name: firebase_core_ffi
description: >-
  The firebase_core implementation for desktop Linux, backed by the Firebase
  C++ SDK through firebase_ffi. Registers itself, so apps use firebase_core
  unchanged.
version: 0.1.0
repository: https://github.com/jwinarske/firebase_ffi
issue_tracker: https://github.com/jwinarske/firebase_ffi/issues

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  firebase_core_platform_interface: ^8.1.1
  firebase_ffi: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

# For this package's own tests only. hooks.user_defines are read from whichever
# package is being built, so these apply when running `flutter test` here and
# never reach a consuming app -- which sets its own products and SDK prefix.
# These tests exercise registration and the app registry, which need no native
# library, so the transport-only build is enough and needs no SDK present.
hooks:
  user_defines:
    firebase_ffi:
      with_firebase: false

# A Dart-only plugin: there is no native code here, because the native code is
# firebase_ffi's single code asset. Declaring it this way is what makes Flutter
# register the implementation on Linux without the app calling anything.
flutter:
  plugin:
    platforms:
      linux:
        dartPluginClass: FirebaseCoreFfi
