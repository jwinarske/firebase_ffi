name: cloud_firestore_ffi
description: >-
  The cloud_firestore implementation for desktop Linux, backed by the Firebase
  C++ SDK through firebase_ffi. Registers itself, so apps use cloud_firestore
  unchanged.
version: 0.1.0
repository: https://github.com/jwinarske/firebase_ffi
issue_tracker: https://github.com/jwinarske/firebase_ffi/issues

publish_to: none

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  cloud_firestore_platform_interface: ^8.0.7
  firebase_core: ^4.0.0
  firebase_ffi: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.0
  firebase_auth_ffi:
    path: ../firebase_auth_ffi
  firebase_core_ffi:
    path: ../firebase_core_ffi
  flutter_test:
    sdk: flutter

# See firebase_core_ffi: read only when this package is under test.
hooks:
  user_defines:
    firebase_ffi:
      with_firebase: false

flutter:
  plugin:
    platforms:
      linux:
        dartPluginClass: CloudFirestoreFfi
