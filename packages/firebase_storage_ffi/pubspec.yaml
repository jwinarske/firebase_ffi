name: firebase_storage_ffi
description: >-
  The firebase_storage implementation for desktop Linux, backed by the Firebase
  C++ SDK through firebase_ffi. Registers itself, so apps use firebase_storage
  unchanged.
version: 0.1.0
repository: https://github.com/jwinarske/firebase_ffi
issue_tracker: https://github.com/jwinarske/firebase_ffi/issues

publish_to: none

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  firebase_core: ^4.0.0
  firebase_ffi:
    path: ../firebase_ffi
  firebase_storage_platform_interface: ^6.0.7
  flutter:
    sdk: flutter

dev_dependencies:
  firebase_auth: ^6.0.0
  firebase_auth_ffi:
    path: ../firebase_auth_ffi
  firebase_core_ffi:
    path: ../firebase_core_ffi
  firebase_storage: ^13.0.0
  flutter_test:
    sdk: flutter

# See firebase_core_ffi: read only when this package is under test.
hooks:
  user_defines:
    firebase_ffi:
      with_firebase: false

flutter:
  plugin:
    platforms:
      linux:
        dartPluginClass: FirebaseStorageFfi
