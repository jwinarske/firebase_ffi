name: firebase_ffi
description: >-
  Firebase for Dart and Flutter on desktop Linux through a single FFI code
  asset — no platform channel, no embedder plugin. Products are opt-in per app.
version: 0.1.0
repository: https://github.com/jwinarske/firebase_ffi
issue_tracker: https://github.com/jwinarske/firebase_ffi/issues

environment:
  sdk: ^3.9.0

dependencies:
  # RFC 8949 decoder for the snapshot payloads. A conformant implementation on
  # this side means a malformed message is rejected by code this project did
  # not write, rather than misparsed by a decoder written to match one encoder.
  cbor: ^6.5.0
  ffi: ^2.1.0
  # Only hook/build.dart uses these. Do not pin to an exact major.minor: a
  # Flutter SDK pins meta 1.18.0 while hooks 2.1.0 wants meta ^1.19.0, so a
  # tight pin makes this package unresolvable from a Flutter app.
  hooks: '>=2.0.0 <3.0.0'
  code_assets: '>=1.0.0 <2.0.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# This package's own test suite is pure Dart, so building it does not need the
# Firebase C++ SDK — without this, `dart test` in a fresh clone fails at the
# hook's configure step before a single test runs.
#
# Only applies when this package is the root. A consuming app supplies its own
# hooks.user_defines.firebase_ffi, so this does not weaken anything downstream.
hooks:
  user_defines:
    firebase_ffi:
      with_firebase: false

