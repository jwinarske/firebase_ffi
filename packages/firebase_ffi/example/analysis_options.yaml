analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:lints/recommended.yaml

linter:
  rules:
    # These programs are command-line output: print is the result, not debris
    # left behind by someone debugging.
    avoid_print: false
