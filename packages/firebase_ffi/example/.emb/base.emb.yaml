# firebase_ffi's benchmark app — the app layer.
#
# Nothing to add on top of the ivi-homescreen board profile: the native library
# comes from this package's own Dart build hook as a code asset, not from an
# embedder plugin, which is the whole point of the exercise. emb stages it into
# the bundle's lib/ beside libapp.so and the VM resolves the @Native externals
# against it.
#
#   emb cross ../../ivi-homescreen --target rpi5-trixie --build --no-verify \
#       --backend drm-kms-egl --app . --mode release \
#       --deploy joel@raspberrypi.local --deploy-dir fdb-bench
id: firebase-nc-bench
type: app
supported_archs: [arm64, x86_64]
supported_host_types: [fedora, ubuntu]

cross:
  # The boards this app targets are all arm-gnu, and the block has to name one:
  # a manifest's cross block is parsed as a target before any target is
  # selected, so an absent provider fails the parse with "unknown cross
  # provider:" -- for `--target local` too, which has no provider by design.
  # Declaring it is what lets this manifest be used on its own, rather than
  # only as `--app` composed into ivi-homescreen's project.
  provider: arm-gnu

  # Firestore is off unless asked for. Set on the command line to build the
  # other overlay:
  #
  #   emb cross ../../ivi-homescreen -D FIREBASE_WITH_FIRESTORE=ON ...
  #
  # CLI defines are baked into the target (CrossTarget.withDefineOverrides), so
  # they reach the augment gates below.
  #
  # They do not give the two configurations separate overlays: the install
  # prefix is overlay-<triple> with no content key, so switching this define
  # rebuilds into the same directory and the last build wins. Switching back
  # leaves the other configuration's archives in place until something
  # overwrites them.
  defines:
    FIREBASE_WITH_FIRESTORE: 'OFF'

  augment:
    # The Firebase C++ SDK, staged into the prefix the *build hook's* CMake
    # searches. emb's cmake wrapper injects the cross toolchain file, which
    # carries CMAKE_SYSROOT and CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY, so
    # find_package(firebase_cpp_sdk CONFIG) in native/CMakeLists.txt resolves
    # against this augment with nothing further to configure.
    #
    # The augment keys the sysroot by its content, so this app gets its own
    # sysroot and pays one full SDK build (~40 min) the first time.
    - pkg: firebase-cpp-sdk
      when: FIREBASE_WITH_FIRESTORE=OFF
      min: "13.12.0"
      url: https://github.com/firebase/firebase-cpp-sdk/archive/refs/tags/v13.12.0.tar.gz
      build: cmake
      static: true
      patches:
        - patches/firebase-cpp-sdk/linux/0001-Disable-unknown-compiler-options.patch
        - patches/firebase-cpp-sdk/common/0002-leveldb-do-not-inherit-another-dependency-s-patch-fi.patch
        - patches/firebase-cpp-sdk/linux/0003-Build-this-SDK-and-its-dependencies-with-a-current-t.patch
        - patches/firebase-cpp-sdk/common/0004-Add-install-rules-for-the-desktop-SDK.patch
        - patches/firebase-cpp-sdk/linux/0005-Recognize-arm-on-desktop-Linux.patch
        - patches/firebase-cpp-sdk/common/0007-Drop-git-gc-from-the-boringssl-patch-step.patch
      defines:
        FIREBASE_CPP_INSTALL: 'ON'
        FIREBASE_USE_BORINGSSL: 'ON'
        FIREBASE_LINUX_USE_CXX11_ABI: 'ON'
        FIREBASE_CPP_BUILD_TESTS: 'OFF'
        FIREBASE_CPP_BUILD_STUB_TESTS: 'OFF'
        CMAKE_POSITION_INDEPENDENT_CODE: 'ON'
        CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        # The three products this package binds, and no others. Without the
        # default off, the SDK builds all thirteen -- analytics, messaging,
        # storage, remote_config and the rest -- which this links none of.
        # scripts/build_firebase_sdk.sh has always selected; the augment had
        # not, and the emb job is what showed the two disagreeing.
        FIREBASE_INCLUDE_LIBRARY_DEFAULT: 'OFF'
        FIREBASE_INCLUDE_AUTH: 'ON'
        FIREBASE_INCLUDE_DATABASE: 'ON'
        # Storage is always built, unlike Firestore, which is gated: it is a
        # REST client over the app's existing transport, so it adds little to
        # the build, and gating it too would square the number of augment
        # variants for a product that costs almost nothing to have available.
        # Whether the library binds it is a separate axis (FDB_WITH_STORAGE).
        FIREBASE_INCLUDE_STORAGE: 'ON'
        FIREBASE_INCLUDE_FUNCTIONS: 'ON'
        FIREBASE_INCLUDE_REMOTE_CONFIG: 'ON'
        # Only Database and its dependencies; Firestore drags in gRPC,
        # protobuf and abseil for products this module does not use.
        FIREBASE_INCLUDE_FIRESTORE: 'OFF'
    - pkg: firebase-cpp-sdk
      when: FIREBASE_WITH_FIRESTORE=ON
      min: "13.12.0"
      url: https://github.com/firebase/firebase-cpp-sdk/archive/refs/tags/v13.12.0.tar.gz
      build: cmake
      static: true
      patches:
        - patches/firebase-cpp-sdk/linux/0001-Disable-unknown-compiler-options.patch
        - patches/firebase-cpp-sdk/common/0002-leveldb-do-not-inherit-another-dependency-s-patch-fi.patch
        - patches/firebase-cpp-sdk/linux/0003-Build-this-SDK-and-its-dependencies-with-a-current-t.patch
        - patches/firebase-cpp-sdk/common/0004-Add-install-rules-for-the-desktop-SDK.patch
        - patches/firebase-cpp-sdk/linux/0005-Recognize-arm-on-desktop-Linux.patch
        - patches/firebase-cpp-sdk/common/0007-Drop-git-gc-from-the-boringssl-patch-step.patch
      defines:
        FIREBASE_CPP_INSTALL: 'ON'
        FIREBASE_USE_BORINGSSL: 'ON'
        FIREBASE_LINUX_USE_CXX11_ABI: 'ON'
        FIREBASE_CPP_BUILD_TESTS: 'OFF'
        FIREBASE_CPP_BUILD_STUB_TESTS: 'OFF'
        CMAKE_POSITION_INDEPENDENT_CODE: 'ON'
        CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        # The three products this package binds, and no others. Without the
        # default off, the SDK builds all thirteen -- analytics, messaging,
        # storage, remote_config and the rest -- which this links none of.
        # scripts/build_firebase_sdk.sh has always selected; the augment had
        # not, and the emb job is what showed the two disagreeing.
        FIREBASE_INCLUDE_LIBRARY_DEFAULT: 'OFF'
        FIREBASE_INCLUDE_AUTH: 'ON'
        FIREBASE_INCLUDE_DATABASE: 'ON'
        # Storage is always built, unlike Firestore, which is gated: it is a
        # REST client over the app's existing transport, so it adds little to
        # the build, and gating it too would square the number of augment
        # variants for a product that costs almost nothing to have available.
        # Whether the library binds it is a separate axis (FDB_WITH_STORAGE).
        FIREBASE_INCLUDE_STORAGE: 'ON'
        FIREBASE_INCLUDE_FUNCTIONS: 'ON'
        FIREBASE_INCLUDE_REMOTE_CONFIG: 'ON'
        # gRPC, protobuf and abseil come with it: ~23 MB of library, which
        # is why this is a separate augment rather than the default.
        FIREBASE_INCLUDE_FIRESTORE: 'ON'
