name: firebase_ffi_example
description: >-
  Programs using the firebase_ffi binding directly: one per product, each a
  plain Dart command-line program with no Flutter.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  firebase_ffi:
    path: ../

dev_dependencies:
  lints: ^6.0.0

# Every product, so any of these programs can run — and no SDK, so a fresh
# clone resolves and analyzes with nothing installed. Replace with_firebase
# with the prefix the Firebase C++ SDK was installed to:
#
#   firebase_sdk: /path/to/firebase-cpp-sdk/install
#
# The path is relative to this pubspec.yaml when it is not absolute, so it
# travels with the checkout instead of naming one machine. Until it is set,
# each program starts, says the build has no Firebase SDK, and stops.
hooks:
  user_defines:
    firebase_ffi:
      products: [auth, database, firestore, storage, functions, remote_config, app_check]
      with_firebase: false
